<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JanSamvad Admin</title><style>body{margin:0;background:#f5f3ed;color:#161616;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.wrap{width:min(1100px,92%);margin:auto}.top{background:#0b0b0b;color:#fff;padding:18px 0}.top h1{margin:0;font-size:22px}.top small{color:#c99a2e}.panel{background:#fff;margin:30px 0;padding:28px;border:1px solid #e5dfd1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-size:12px;font-weight:800;color:#666;display:block;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;box-sizing:border-box;font:inherit}textarea{min-height:180px}.full{grid-column:1/-1}.btn{background:#c99a2e;border:0;padding:12px 20px;font-weight:800;cursor:pointer}.muted{color:#777;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><h1>जनसंवाद <small>ADMIN</small></h1></div></header><main class="wrap"><section class="panel"><h2>Publish New Update</h2><p class="muted">यह panel Cloudflare Pages + D1 CMS API के लिए तैयार है। Production में ADMIN_KEY environment secret से authentication होगा।</p><div class="grid"><div><label>Headline</label><input id="title" placeholder="खबर की headline"></div><div><label>Category</label><select id="category"><option>Himachal</option><option>District</option><option>Development</option><option>Public Information</option><option>Video</option></select></div><div><label>District</label><select id="district"><option>Statewide</option><option>Bilaspur</option><option>Mandi</option><option>Shimla</option><option>Kangra</option><option>Hamirpur</option><option>Kullu</option><option>Solan</option><option>Una</option><option>Chamba</option><option>Sirmaur</option><option>Kinnaur</option><option>Lahaul-Spiti</option></select></div><div><label>Featured Image URL</label><input id="image" placeholder="https://..."></div><div class="full"><label>Article Content</label><textarea id="body" placeholder="पूरी खबर यहां लिखें..."></textarea></div><div><label>YouTube URL (optional)</label><input id="video" placeholder="https://youtube.com/watch?v=..."></div><div><label>Official Source URL</label><input id="source" placeholder="Official source"></div><div><label>Admin Key</label><input id="key" type="password" placeholder="Cloudflare ADMIN_KEY"></div></div><p><button class="btn" onclick="publish()">Publish Update</button></p><pre id="status"></pre></section></main><script>async function publish(){const status=document.getElementById('status');status.textContent='Publishing...';const data={title:title.value,category:category.value,district:district.value,image:image.value,body:body.value,video:video.value,source:source.value};try{const r=await fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':key.value},body:JSON.stringify(data)});const j=await r.json();status.textContent=r.ok?'Published successfully.':('Error: '+(j.error||'Request failed'));}catch(e){status.textContent='CMS API is not connected yet. Deploy this repo to Cloudflare Pages and bind D1 as DB.';}}</script></body></html>
